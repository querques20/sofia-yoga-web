    <path fill="#E6D8C7" d="M168 464 C 168 476 176 482 192 480 C 198 478 196 472 188 468 Z"/>
    <g fill="none" stroke="#39463A" stroke-width="1.8" stroke-linecap="round" opacity="0.45">
      <path d="M262 472 C 266 476 270 478 275 478"/>
