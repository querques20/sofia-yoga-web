        <ellipse cx="0" cy="-18" rx="8" ry="18" transform="rotate(120)"/>
        <ellipse cx="0" cy="-18" rx="8" ry="18" transform="rotate(180)"/>
        <ellipse cx="0" cy="-18" rx="8" ry="18" transform="rotate(240)"/>
