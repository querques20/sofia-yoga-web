    <g fill="#DDE4D9">
      <ellipse cx="146" cy="366" rx="120" ry="108" transform="rotate(-20 146 366)"/>
      <ellipse cx="112" cy="300" rx="62" ry="50" transform="rotate(30 112 300)"/>
