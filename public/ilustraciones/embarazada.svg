<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 520" role="img" aria-label="Femme enceinte de profil, les yeux fermés, une main posée sur le ventre">
  <!-- Sofía Yoga · ilustración con más detalle · misma base que embarazada-perfil.svg
       paleta del dossier v2 (sin terracota); las sombras y luces son esos mismos colores con transparencia -->
  <defs>
    <!-- estampado de puntitos para el vestido -->
    <pattern id="puntos" width="13" height="13" patternUnits="userSpaceOnUse" patternTransform="rotate(18)">
      <ellipse cx="4" cy="4" rx="1.5" ry="1.8" fill="#DDE4D9"/>
      <ellipse cx="10.5" cy="10.5" rx="1.2" ry="1.5" fill="#DDE4D9"/>
    </pattern>
    <!-- grano suave, solo sobre los dibujos (el fondo sigue transparente) -->
    <filter id="grano" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="4" result="ruido"/>
      <feColorMatrix in="ruido" type="matrix" values="0 0 0 0 0.22  0 0 0 0 0.27  0 0 0 0 0.23  0 0 0 0.2 0" result="ruidoVerde"/>
      <feComposite in="ruidoVerde" in2="SourceGraphic" operator="in" result="ruidoAdentro"/>
      <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="ruidoAdentro"/></feMerge>
    </filter>
    <clipPath id="recorte-vestido"><path d="M204 160 C 194 164 186 172 184 184 C 180 220 178 250 176 290 C 174 340 166 400 156 462 C 170 468 186 466 200 470 C 216 474 232 468 248 472 C 262 475 274 468 284 462 C 280 420 276 380 274 352 C 296 334 308 306 304 278 C 300 250 284 230 262 222 C 268 212 266 196 256 186 C 248 176 240 166 234 162 C 226 168 212 166 204 160 Z"/></clipPath>
  </defs>

  <g filter="url(#grano)">
