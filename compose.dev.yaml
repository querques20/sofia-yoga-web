# Local Postgres for the admin. Development only: the password is not a secret and the port listens on
# localhost alone.
#
#   docker compose -f compose.dev.yaml up -d
#
# Then DATABASE_URL in .env.local (see .env.example) and `pnpm migrate:deploy`.
name: sofia-yoga-dev

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: sofia
      POSTGRES_PASSWORD: sofia
      POSTGRES_DB: sofia
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sofia -d sofia"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  db:
